[workspace]
exclude = ["vendor/evo-libs"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/evodesign", "apps/evodesign-cli", "xtask"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tazerty/evodesign"

[workspace.dependencies]
# Shared reader and writer; publish the immutable revision before this consumer.
evo-pdf = { path = "vendor/evo-libs/evo-pdf", default-features = false }
# internal
evodesign-geom = { path = "crates/geom" }
evodesign-color = { path = "crates/color" }
evodesign-doc = { path = "crates/doc" }
evodesign-fonts = { path = "crates/fonts" }
evodesign-compose = { path = "crates/compose" }
evodesign-images = { path = "crates/images" }
evodesign-render = { path = "crates/render" }
evodesign-pdf = { path = "crates/pdf" }
evodesign-idml = { path = "crates/idml" }
evodesign-epub = { path = "crates/epub" }
evodesign-pptx = { path = "crates/pptx" }
evodesign-textimport = { path = "crates/textimport" }
evodesign-format = { path = "crates/format" }
evodesign-tools = { path = "crates/tools" }
evodesign-engine = { path = "crates/engine" }
evodesign-ui-egui = { path = "crates/ui-egui" }
evodesign-mcp = { path = "crates/mcp" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
fancy-regex = "0.19.2"
tempfile = "3"
same-file = "1.0.6"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "=0.8.1"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# INDD/INDT → IDML conversion for File › Open: storytold/indd-utils, tracking its main branch
# (MIT OR Apache-2.0, no dependencies, builds for wasm).
indd = { git = "https://github.com/storytold/indd-utils", branch = "main" }

# Which paths stored in documents may be followed (evo-libs).
evo-docpath = { path = "vendor/evo-libs/evo-docpath" }
# Atomic file replacement for saves and exports (evo-libs).
evo-atomic = { path = "vendor/evo-libs/evo-atomic" }
# File › Print through the system print spooler (evo-libs).
evo-print = { path = "vendor/evo-libs/evo-print" }

# ICC colour management: working spaces, transforms, black point compensation (evo-libs).
evo-cms = { path = "vendor/evo-libs/evo-cms" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
evo-ui = { path = "vendor/evo-libs/evo-ui", features = ["serde"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Opt-in cancelable macOS termination on the pinned winit 0.30 line.
[patch.crates-io]
krilla = { path = "vendor/evo-libs/krilla" }
winit = { git = "https://github.com/storytold/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }
hayro = { path = "vendor/evo-libs/hayro" }
hayro-interpret = { path = "vendor/evo-libs/hayro-interpret" }
hayro-syntax = { path = "vendor/evo-libs/hayro-syntax" }
hayro-jbig2 = { path = "vendor/evo-libs/hayro-jbig2" }
hayro-cmap = { path = "vendor/evo-libs/hayro-cmap" }
