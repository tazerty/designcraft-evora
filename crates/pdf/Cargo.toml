[package]
name = "evodesign-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoDesign PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints]
workspace = true

[dependencies]
evodesign-geom = { workspace = true }
evodesign-color = { workspace = true }
evodesign-doc = { workspace = true }
evodesign-fonts = { workspace = true }
evodesign-compose = { workspace = true }
evo-pdf = { workspace = true, features = ["write-pdf"] }
krilla-svg = { workspace = true }
evodesign-images = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# The placed-PDF version check names hayro's PdfVersion (krilla::pdf::Pdf::version returns it).
hayro-syntax = "0.7.2"

[dev-dependencies]
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }
tiff = { workspace = true }
evodesign-fonts = { workspace = true, features = ["testing"] }
