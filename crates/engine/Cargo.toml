[package]
name = "evodesign-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoDesign engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
evo-print = { workspace = true }
evo-docpath = { workspace = true }
evodesign-images = { workspace = true }
evodesign-geom = { workspace = true }
evodesign-color = { workspace = true }
evodesign-doc = { workspace = true }
evodesign-fonts = { workspace = true }
evodesign-compose = { workspace = true }
evodesign-render = { workspace = true }
evodesign-format = { workspace = true }
evodesign-epub = { workspace = true }
evodesign-pptx = { workspace = true }
evodesign-textimport = { workspace = true }
evodesign-pdf = { workspace = true }
evodesign-tools = { workspace = true }
evodesign-idml = { workspace = true }
indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
evo-atomic = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
evodesign-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
