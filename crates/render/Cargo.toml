[package]
name = "evodesign-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoDesign renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
evodesign-geom = { workspace = true }
evodesign-color = { workspace = true }
evodesign-doc = { workspace = true }
evodesign-fonts = { workspace = true }
evodesign-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
evo-pdf = { workspace = true, features = ["raster"] }
evodesign-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
