[package]
name = "evodesign-images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoDesign placed-graphic decoding: raster formats (PNG, JPEG, GIF, WebP, TIFF, BMP, PSD) and SVG"

[lints]
workspace = true

[dependencies]
evodesign-color = { workspace = true }
evodesign-fonts = { workspace = true }
image = { workspace = true }
tiff = { workspace = true }
resvg = { workspace = true }
log = { workspace = true }
evo-cms = { workspace = true }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = "0.5"

[dev-dependencies]
evodesign-fonts = { workspace = true, features = ["testing"] }
