[package]
edition = "2021"
rust-version = "1.92"
name = "krilla"
version = "0.8.2"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
exclude = ["src/tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-level crate for creating PDF files."
readme = "README.md"
keywords = ["pdf"]
categories = ["graphics", "multimedia"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/LaurenzV/krilla"

[features]
comemo = ["dep:comemo"]
default = ["raster-images", "simple-text"]
pdf = ["dep:hayro-write"]
raster-images = ["dep:png", "dep:zune-jpeg", "dep:gif", "dep:image-webp", "dep:imagesize"]
rayon = ["dep:rayon"]
simple-text = ["dep:rustybuzz"]

[lib]
name = "krilla"
path = "src/lib.rs"

[dependencies]
base64 = { version = "0.22.1" }
bumpalo = { version = "3.16.0" }
comemo = { version = "0.5.0", optional = true }
flate2 = { version = "1.1.0" }
float-cmp = { version = "0.9.0" }
gif = { version = "0.14.2", optional = true }
hayro-write = { version = "0.7.0", optional = true }
image-webp = { version = "0.2.1", optional = true }
imagesize = { version = "0.14.0", optional = true }
indexmap = { version = "2.10.0" }
pdf-writer = { version = "0.15.0" }
png = { version = "0.18.1", optional = true }
rayon = { version = "1.10.0", optional = true }
rustc-hash = { version = "2.1.1" }
rustybuzz = { version = "0.20.1", optional = true }
siphasher = { version = "1.0.1" }
skrifa = { version = "0.42.0" }
smallvec = { version = "1.15.1", features = ["union", "const_new", "write"] }
subsetter = { version = "0.2.6", features = ["variable-fonts"] }
tiny-skia-path = { version = "0.12.0" }
xmp-writer = { version = "0.3.3" }
yoke = { version = "0.8.0", features = ["derive"] }
zune-jpeg = { version = "0.5.5", optional = true }

